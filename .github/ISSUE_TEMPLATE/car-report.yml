name: 차량 제보
description: 내 차에서 Korea Projection(무선 카플레이·무선 안드로이드 오토)이 되는지 알려 주세요
title: "차량 제보: "
labels: ["차량 제보"]
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 동작이 확인된 차는 지원 목록에 추가합니다.

        **비밀번호, 차대번호(VIN), 전화번호, 휴대폰 이름은 적지 마세요.** 리포트 파일에는 들어 있지 않습니다.

        **같은 차를 이미 제보하셨다면 새 이슈 대신 그 이슈에 댓글로 남겨 주세요.** 파일도 댓글에 끌어다 놓으면 됩니다.

        처음이면 [내 차 제보 가이드](https://github.com/StopDragon/korea-projection/blob/main/docs/car-report-guide.md)를 천천히 따라 해 주세요.

        **제보 파일 만드는 방법 (Korea Projection 1.5.2 이상)**
        1. 차를 세운 상태에서 USB를 꽂습니다.
        2. NEMESIS Manager → My Packages → **Korea Projection: Wireless for Korean Cars**(1.5.6 이하는 Korea Projection 또는 Wireless Projection for Korean Cars) → **Launch**를 누릅니다.
        3. "이제 USB를 빼셔도 됩니다"가 뜰 때까지 1~2분 기다립니다.
        4. USB의 **`KoreaProjection-report`** 폴더에 파일 3개가 생깁니다: `1-report.md`, `2-car-report.json`, `3-log.txt`
        5. 그 폴더를 열고 **모두 선택**(Windows `Ctrl`+`A`, Mac `⌘`+`A`)해서 아래 "제보 파일 3개" 칸에 끌어다 놓아 주세요.
  - type: input
    id: car
    attributes:
      label: 차종과 연식
      placeholder: "예: 2020 기아 니로 하이브리드"
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: 내비 소프트웨어 버전
      description: 리포트의 "펌웨어" 줄, 또는 설정 → 일반 → 소프트웨어 정보
      placeholder: "예: DEPEHEV.KOR.0000.V039.001.260902"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: 결과
      options:
        - 무선 카플레이가 연결됨
        - 아이폰에 무선 연결 제안은 뜨지만 연결이 안 됨
        - 아이폰에 무선 연결 제안이 안 뜸
        - 패키지가 설치되지 않음
        - 기타
    validations:
      required: true
  - type: checkboxes
    id: installed
    attributes:
      label: 설치한 것
      options:
        - label: NEMESIS
        - label: HMG-API (버전은 리포트에 나옵니다)
        - label: HMG-API 무선 모드 (wireless-carplay-aa)
        - label: wireless.projection
        - label: Korea Projection
  - type: checkboxes
    id: tested
    attributes:
      label: 써 본 기능 (해당하는 것만)
      options:
        - label: 카카오맵 길안내
        - label: T맵 길안내
        - label: 네이버 지도 길안내
        - label: 애플 지도 길안내
        - label: 계기판 길안내(회전 안내) 표시
        - label: 음악 (멜론, 지니, 유튜브 뮤직 등)
        - label: 전화, 시리
        - label: 무선 안드로이드 오토 (결과는 아래 "그 밖에 알려 주실 것"에 적어 주세요)
  - type: textarea
    id: report
    attributes:
      label: 상태 요약 (내비 화면의 QR로 열면 자동으로 채워짐)
      description: 내비 상태 화면의 QR을 폰으로 찍어 이 양식을 열었다면 여기가 이미 채워져 있습니다. 컴퓨터로 열었다면 비워 두셔도 됩니다
  - type: textarea
    id: files
    attributes:
      label: 제보 파일 3개
      description: USB의 KoreaProjection-report 폴더 안 파일 3개(1-report.md, 2-car-report.json, 3-log.txt)를 한꺼번에 끌어다 놓아 주세요. 파일 이름이 이 칸에 나타나면 성공입니다
      placeholder: 여기에 파일 3개를 끌어다 놓으세요 (폰으로 QR을 찍어 열었다면, 나중에 컴퓨터에서 댓글로 붙여 주셔도 됩니다)
  - type: textarea
    id: notes
    attributes:
      label: 그 밖에 알려 주실 것
      description: 언제, 어떻게 했는지, 화면에 뜬 메시지 등. 화면 멈춤처럼 가끔 생기는 문제는 생긴 시각과 쓰던 앱을 적고, 몇 분 안에 제보 파일을 만들어 주세요
